---
dependencies:
  zsh:
    package: "zsh"
    repo: "extra"
syms:
  common:
    zshenv:
      origin: "src/core/.zshenv"
      destiny: ".zshenv"
    zshignore:
      origin: "src/core/.zshignore"
      destiny: ".config/zsh/.zshignore"
    zshrc:
      origin: "src/core/.zshrc"
      destiny: ".config/zsh/.zshrc"
    exports:
      origin: "src/core/exports.zsh"
      destiny: ".config/zsh/exports.zsh"
  arch:
    aliases:
      origin: "src/arch/aliases.zsh"
      destiny: ".config/zsh/aliases.zsh"
    functions:
      origin: "src/arch/functions.zsh"
      destiny: ".config/zsh/functions.zsh"
    heavy-functions:
      origin: "src/arch/heavy-functions.zsh"
      destiny: ".config/zsh/heavy-functions.zsh"
    hooks:
      origin: "src/arch/hooks.zsh"
      destiny: ".config/zsh/hooks.zsh"
    prompt:
      origin: "src/arch/prompt.zsh"
      destiny: ".config/zsh/prompt.zsh"
    startup:
      origin: "src/arch/startup.zsh"
      destiny: ".config/zsh/startup.zsh"
    variables:
      origin: "src/arch/variables.zsh"
      destiny: ".config/zsh/variables.zsh"
  bedrock:
    aliases:
      origin: "src/bedrock/aliases.zsh"
      destiny: ".config/zsh/aliases.zsh"
    functions:
      origin: "src/bedrock/functions.zsh"
      destiny: ".config/zsh/functions.zsh"
    heavy-functions:
      origin: "src/bedrock/heavy-functions.zsh"
      destiny: ".config/zsh/heavy-functions.zsh"
    hooks:
      origin: "src/bedrock/hooks.zsh"
      destiny: ".config/zsh/hooks.zsh"
    prompt:
      origin: "src/bedrock/prompt.zsh"
      destiny: ".config/zsh/prompt.zsh"
    startup:
      origin: "src/bedrock/startup.zsh"
      destiny: ".config/zsh/startup.zsh"
    variables:
      origin: "src/bedrock/variables.zsh"
      destiny: ".config/zsh/variables.zsh"
make:
  common:
    own:
      origin: "src/core/own.zsh"
      destiny: ".config/zsh/own.zsh"
      content: |
        # Add your own configuration for the .zshrc in here
